# Build with a JDK 20 — the BotWithUs client runs Java 20 with preview features
# enabled, and preview bytecode is version-locked, so JDK 20 is required.
#
# Either run Gradle with a JDK 20 on PATH, or point Gradle at one, e.g.:
# org.gradle.java.home=C:/Users/<you>/.<clientid>/jre   (folder with bin/javac.exe)

org.gradle.jvmargs=-Xmx1024m
org.gradle.daemon=true
